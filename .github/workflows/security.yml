name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install dependency auditor
        working-directory: ${{ runner.temp }}
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit locked dependencies
        working-directory: ${{ runner.temp }}
        run: cargo audit --file "$GITHUB_WORKSPACE/Cargo.lock"
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --release --locked
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo web
      - run: cargo build --locked
      - run: node scripts/test-web.mjs
      - run: node scripts/test-playground.mjs
