[package]
name = "scripturec"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "scripturec"
path = "src/main.rs"

[dependencies]
lalrpop-util = { version = "=0.23.2", default-features = false, features = ["std"] }
logos = "0.16.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"

[build-dependencies]
lalrpop = { version = "=0.23.2", default-features = false }
